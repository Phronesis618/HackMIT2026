name: Deploy solo demo to GitHub Pages

# Public SOLO build only. GitHub Pages is static: there is no /api or /ws, so the client
# detects the missing server and runs the clearly labelled offline fixture world in the
# browser. Live generation and LAN co-op need the Node server (`npm start`) on a real host.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Enables Pages (source: GitHub Actions) on first run when the token allows it.
      # If this step fails, enable it once by hand: Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          RELAY_BASE_PATH: /HackMIT2026/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
