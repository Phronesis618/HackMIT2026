services:
  - type: web
    name: relay
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: RELAY_FLOORS
        value: "1"
      - key: RELAY_LAWS
        value: "1"
      - key: RELAY_GENERATION_MODE
        value: live
      - key: RELAY_AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
